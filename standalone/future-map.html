tancy to analytics to running things.",checklist:["Notice if you like the rules of money (accounting) or the bets (markets)","Follow one real company for a month — what actually makes it money?"],opportunities:["Commerce stream (with or without Maths)","CA / Analytics / Management"],challengeQuestion:"Commerce splits hard on one question: do you want Maths in the mix or not? That single choice closes and opens whole careers. Which way do you lean, and why?"},{id:"i_people",stage:1,label:"People, words & society",subtitle:"why people do what they do, and how to say it well",traitDelta:{people:2,creative:1},insight:"Interest in people and ideas is the spine of humanities — law, civil services, psychology, media. Often underrated on pay, often undersold at home.",checklist:["Write something and show it to someone honest","Notice: are you drawn to understanding people, or to changing systems?"],opportunities:["Humanities stream","Law / Civil services / Psychology / Media"],challengeQuestion:'Humanities gets called "the easy stream" and "no scope" at home. Some of these paths out-earn engineering; some genuinely struggle early. Do you actually know which is which yet?'},{id:"i_make",stage:1,label:"Making & designing",subtitle:"visuals, products, experiences — things people use and feel",traitDelta:{creative:2,risk:1},insight:"A maker’s instinct crosses streams. Design is a real, well-paid path — but it rewards a portfolio far more than a percentage.",checklist:["Start collecting your work somewhere, even if it’s rough","Look up one entrance exam (NID / UCEED) to see what design school actually tests"],opportunities:["Design (from most streams)","Architecture / Digital media"],challengeQuestion:'Design school judges a portfolio, not your board marks. Are you building one, or just hoping you’re "creative"?'},{id:"i_data",stage:1,label:"Screens, code & data",subtitle:"software, patterns in data, building things that run",traitDelta:{analytical:2,creative:1,risk:1},insight:"The pull toward code and data runs into engineering (CSE), analytics, and design — some needing PCM, some reachable from commerce.",checklist:["Build one tiny thing that runs — a script, a site, a bot","Notice if you like the building or the maths underneath it"],opportunities:["Science (PCM) → CSE","Commerce + Maths → Analytics"],challengeQuestion:'Everyone says "get into tech." The seats at the top are as fought-over as anything in India. What’s your honest read on where you’d actually land?'}],bc=[{id:"s_pcm",stage:2,label:"Science — PCM",subtitle:"Physics · Chemistry · Maths",traitDelta:{analytical:2,structure:1},insight:"The widest-optionality stream on paper — engineering, architecture, design, pure science, and a pivot into most commerce careers later. It is also the most competitive and the most maths-heavy.",checklist:["Be honest about your relationship with maths — this stream lives or dies on it","Decide if you’re taking a JEE-style entrance seriously, or keeping it broad"],opportunities:["Engineering","Architecture","Design","Pure sciences"],challengeQuestion:'PCM keeps the most doors open — which is also why students pick it by default and burn out. Are you choosing it, or defaulting to it because it "keeps options open"?',entrancePrepCost:"JEE coaching: ₹0 (self-study) to ₹1.5–3L for 2 years of a top institute"},{id:"s_pcb",stage:2,label:"Science — PCB",subtitle:"Physics · Chemistry · Biology",traitDelta:{analytical:1,people:1,structure:1},insight:"The health-and-life-sciences stream — medicine, biotech, allied health, research. The MBBS route is long and fiercely gated; the allied-health routes are shorter and far less talked about.",checklist:["Look past MBBS at one allied-health or biotech route","Know that most bio careers need a master’s to pay well"],opportunities:["Medicine (MBBS)","Biotechnology","Allied health","Research"],challengeQuestion:'PCB is often taken as "the doctor stream." If MBBS doesn’t happen — and for ~93% of NEET aspirants it d inely hard early. The stream doesn’t decide that, the path does.",checklist:['Have the "no scope" conversation at home with actual numbers, not vibes',"Pick one specific path to anchor — humanities punishes drifting"],opportunities:["Law","Civil services","Psychology","Journalism / media"],challengeQuestion:"Humanities gives you the most freedom and the least structure. Freedom without a chosen target is how people drift for three years. Do you have a target, or just a stream?"}];function ie(e){return{...e,lastVerified:jx,jobSearchUrl:e.searchKeywords?ym(e.searchKeywords):void 0,courseSearchUrl:e.searchKeywords?vm(e.searchKeywords):void 0}}const mo=[ie({id:"c_engineering",stage:3,parentId:"s_pcm",label:"Engineering",subtitle:"B.Tech / B.E. across dozens of branches",traitDelta:{analytical:3,structure:1},insight:"The default aspiration for PCM — and the most bimodal outcome on this whole map. The top ~40 institutes place extraordinarily well; the long tail of 3,000+ colleges does not. Which college matters far more than the degree.",checklist:["Pick a target exam (JEE Main / Advanced, or state CET) and a realistic institute band","Choose a branch by interest, not by last year’s placement rumour","Build one project outside coursework — it separates you more than marks do"],opportunities:["Core (mechanical, civil, electrical) + software roles","CSE / IT — the highest-demand, most-fought-over branch","Public-sector (PSU) and higher study (M.Tech / MS / MBA)"],challengeQuestion:"Roughly 12–15 lakh students sit JEE each year for a few thousand top seats, and median placements outside the top tier are far below the IIT headline you’re picturing. Is your read still that this fits — and at which institute band?",costMin:8,costMax:25,yearsToFirstIncome:4,payDescription:"₹4–8L average to start; ₹12–25L+ at IIT/NIT and top CSE — the spread is enormous and college-dependent",eligibilityThreshold:{metric:"Class 12 PCM % + JEE/CET rank",typicalValue:"75%+ PCM for good private admi , maths as a career, not just a stepping-stone. Modest pay through a bachelor’s, but the ceiling opens after a master’s or PhD, and the intellectual depth is unmatched. IISER / IIT-BS routes changed this path’s prestige.",checklist:["Look at IISERs and IIT integrated BS-MS (via IAT / JEE) — they reset the ceiling","Accept that this is usually a master’s-minimum path to real pay","Find one research area you’d read about unpaid — that’s the tell"],opportunities:["Research (labs, IISER/TIFR/CSIR), academia","Data / quant roles that hire strong maths & physics grads","R&D in industry after a master’s"],challengeQuestion:"A plain B.Sc pays modestly and the real money is 5–7 years out via a master’s or PhD. That’s a long deferral for someone who might just like the subject now. Is the deferral one you actually want, or one you’re not seeing?",costMin:3,costMax:10,yearsToFirstIncome:3,payDescription:"Modest through M.Sc; ₹6–15L+ opens up post-PhD or in quant/data roles",eligibilityThreshold:{metric:"Class 12 PCM % (IAT / JEE for top institutes)",typicalValue:"60%+ for good universities; IAT for IISERs",note:"Elite research institutes have their own entrances — verify per institute."},searchKeywords:"research scientist",sourceUrls:[{title:"IISER admissions (official)",url:"https://www.iiseradmission.in/"}]}),ie({id:"c_design",stage:3,parentId:"s_pcm",label:"Design",subtitle:"B.Des — product, communication, UX, more",traitDelta:{creative:3,risk:1},insight:"A real, well-paid, portfolio-first career that most families still under-rate. Reachable from most streams via NID DAT / UCEED — your body of work matters far more than your board percentage. Cross-listed here because many designers come from PCM.",checklist:["Build a portfolio now — it is the actual entry ticket, not marks","Prep for NID DAT (NID) or UCEED (IIT design programmes)","Talk to one working designer about the unglamorous early years"],opportunities:["UX / product design (the highest-paying design track today)", :2},insight:"A flexible, low-cost base that becomes valuable when you stack a real credential on it — CFA level 1, FRM, a good MBA, or serious Excel/analytics skill. On its own it’s common; layered, it’s a genuine finance on-ramp.",checklist:['Plan the "+1" from day one — a certification or skill that lifts a plain B.Com',"Get comfortable with Excel/financial modelling early","Target internships — finance hires heavily on them"],opportunities:["Banking, financial analysis, audit, accounting roles","Fintech and analytics with the right add-on skills","MBA finance later"],challengeQuestion:'A plain B.Com starts around ₹3–5L and there are a lot of them. The pay you’re imagining usually belongs to the B.Com plus a CFA/MBA/skill. What’s your specific "+1" going to be?',costMin:2,costMax:8,yearsToFirstIncome:3,payDescription:"₹3–5L to start; climbs with certifications (CFA/FRM) or an MBA",eligibilityThreshold:{metric:"Class 12 % + CUET for top colleges",typicalValue:"75%+ for good colleges; CUET-driven",note:"Top-college cutoffs shift yearly — verify via CUET/college."},searchKeywords:"finance analyst commerce",sourceUrls:[{title:"CUET — NTA (official)",url:"https://cuet.nta.nic.in/"}]}),ie({id:"c_analytics",stage:3,parentId:"s_com_m",label:"Business analytics",subtitle:"data + business — BBA-analytics / B.Sc analytics",traitDelta:{analytical:3,creative:1,risk:1},insight:"The commerce-side route into the data economy. Entry pay is ordinary, but real project experience and tool fluency (SQL, Python, Power BI) move it fast. The degree opens the door; what you can actually build keeps it open.",checklist:["Learn SQL + one BI tool + basic Python outside class — non-negotiable","Build a portfolio of real analyses, not just coursework","Chase internships where you touch real data"],opportunities:["Analyst roles across every industry","Data / product analytics; a bridge toward data science","Consulting and operations analytics"],challengeQuestion:"Analytics starts at a modest ₹3 ","saturat","no jobs","oversupply","too many engineers","no scope"],truthVerdict:"partly_true",summary:"True at the bottom of the field, false at the top. India produces far more engineering graduates than the market absorbs — but that glut is concentrated in the long tail of colleges. Top institutes and in-demand branches (CSE, core specialisations) still place well.",detail:'The oversupply is real in aggregate: a large share of graduates from lower-tier colleges are underemployed. But this is a college-and-branch story, not a "engineering is dead" story. The gap between a top-40 institute and a random private college is enormous and widening. The honest reframing is: engineering isn’t saturated, the bottom of it is.',sources:[{title:"AICTE — approved institutions & intake data",url:"https://www.aicte-india.org/",tier:"primary"},{title:"NIRF — engineering rankings & placement data",url:"https://www.nirfindia.org/",tier:"primary"}],affects:["c_engineering","s_pcm","c_analytics"],relevant:{impact:"partial_adjustment",note:e=>`It doesn’t sink ${st(e.chosenPathId)} as a field, but it should sharpen the question from "engineering?" to "which institute band?" — that’s where your actual outcome is decided.`},tangential:{impact:"no_change",note:()=>"This is about engineering; it doesn’t touch your current path. The one transferable lesson: in any crowded field, the institution tier does the heavy lifting."}},{id:"humanities_no_money",keywords:["humanities","arts","no money","no scope","no future","useless degree","waste"],truthVerdict:"misleading",summary:'A stream-level claim about path-level realities. Some humanities paths (law from a top NLU, civil services, economics from a strong school) out-earn a median engineer; others (early journalism, a plain B.A.) genuinely pay modestly at the start. "Humanities = no money" collapses that range into a falsehood.',detail:"The evidence points to spread, not a floor. The stream doesn’t determine income — the specific path and college do, exactly as they do in science and commerce. The claim usually carries family anxiety more than data; the useful move is to name the specific path and check its specific numbers.",sources:[{title:"CLAT / NLU placement disclosures",url:"https://consortiumofnlus.ac.in/",tier:"primary"},{title:"UPSC — recruitment & pay (7th CPC)",url:"https://upsc.gov.in/",tier:"primary"}],affects:["s_hum","c_law","c_civil_services","c_psychology","c_journalism","c_economics"],relevant:{impact:"no_change",note:e=>`As a blanket claim it doesn’t hold against ${st(e.chosenPathId)} specifically — but it’s worth having the real numbers ready for whoever said it, because this is the claim most likely to be used to talk you out of it.`},tangential:{impact:"not_applicable",note:()=>"This is about the humanities stream and doesn’t bear on your current path. Flagging it mainly because it’s the most common unexamined claim in this whole space."}},{id:"ai_replaces_coders",keywords:["ai will replace","ai replacing","coders","programmers","software has no future","cse dead","coding dead"],truthVerdict:"partly_true",summary:"Directionally real, wildly overstated. AI is genuinely pressuring rote, entry-level coding and raising the bar for what a junior needs to bring. It is not eliminating demand for engineers who can design systems, judge trade-offs, and work with the tools rather than compete with them.",detail:'The measured shift is in the nature of the work and the entry bar, not the existence of the field. The people most exposed are those whose only skill was producing boilerplate; the people least exposed are those who can architect and adapt. Treat it as "raise your ceiling," not "abandon ship."',sources:[{title:"NASSCOM — India tech industry & talent reports",url:"https://nasscom.in/",tier:"primary"}],affects:["c_engineering","s_pcm","c_analytics","i_data"],relevant:{impact:"partial_adjustment",note:e=>`It doesn’t close ${st(e.chosenPathId)}, but it changes what "good enough" means: plan to build real projects and judgment, not just clear coursework. The floor is rising.`},tangential:{impact:"no_change",note:()=>"This is a software-industry claim and doesn’t touch your current path."}},{id:"mbbs_rich",keywords:["doctor","mbbs","rich","guaranteed","lot of money","good money","settled"],truthVerdict:"partly_true",summary:"Eventually, for many — but not soon, and not without a long second climb. MBBS is ~6.5 years to a first real paycheck, the intern stipend is modest, and most doctors now need a PG seat (itself fiercely competitive) before the income matches the reputation.",detail:'The endpoint can be genuinely high, especially for specialists. The claim goes wrong on timeline and certainty: it hides the ~6.5-year runway, the PG bottleneck, and the fact that ~93% of NEET aspirants never get an MBBS seat at all. "Doctors are rich" is a statement about year 12 of the journey told as if it’s year 1.',sources:[{title:"NEET-UG — NTA (official)",url:"https://neet.nta.nic.in/",tier:"primary"},{title:"NMC — medical education norms",url:"https://www.nmc.org.in/",tier:"primary"}],affects:["c_medicine","s_pcb"],relevant:{impact:"worth_reconsidering",note:e=>`If "guaranteed money" is a load-bearing reason for ${st(e.chosenPathId)}, it’s worth re-examining — the money is real but late and conditional on a PG seat, not the degree alone.`},tangential:{impact:"no_change",note:()=>"This is about medicine and doesn’t touch your current path."}},{id:"ca_easy",keywords:["ca","chartered","easy","anyone can","simple","just study"],truthVerdict:"misleading",summary:"The opposite of easy. CA is one of the cheapest high-return qualifications in India precisely because the exams filter hard — the Final pass rate is often under 20% per attempt, and most people take several years and multiple attempts including articleship.",detail:"Whoever called it easy is usually pointing at the low fees, not the exams. The low cost is real; the difficulty is what makes the qualification worth something. Plan for it as a multi-year, multi-attempt commitment, not a quick certificate.",sources:[{title:"ICAI — exams & pass percentages",url:"https://www.icai.org/",tier:"primary"}],affects:["c_ca","s_com_m"],relevant:{impact:"partial_adjustment",note:e=>`Doesn’t change whether ${st(e.chosenPathId)} is worth it — it very much can be — but it should reset your plan to "years and multiple attempts," so you’re not blindsided if the first one doesn’t clear.`},tangential:{impact:"no_change",note:()=>"This is about CA and doesn’t touch your current path."}},{id:"govt_only_safe",keywords:["government job","govt job","sarkari","upsc","civil services","only safe","secure","stable"],truthVerdict:"misleading",summary:'Secure if you get it — and that "if" is the whole story. UPSC selects roughly 0.1–0.2% of aspirants, after years of full-time prep most people give up several years to. The security is real; the odds and the opportunity cost usually go unmentioned.',detail:"This is a survivorship claim: it describes the small number who cleared, not the large number who spent their early twenties trying and didn’t. Security is a genuine draw, but it should be weighed against the hit-rate and the years — and it demands a real plan B.",sources:[{title:"UPSC — annual report & selection data",url:"https://upsc.gov.in/",tier:"primary"}],affects:["c_civil_services","s_hum"],relevant:{impact:"worth_reconsidering",note:e=>`If security is the main reason for ${st(e.chosenPathId)}, weigh it against a ~0.1–0.2% hit-rate and years of prep. Worth doing — with a concrete plan B, not instead of one.`},tangential:{impact:"no_change",note:()=>"This is about civil services and doesn’t touch your current path."}},{id:"design_no_scope",keywords:["design","drawing","no scope","not a real career","no money","hobby"],truthVerdict:"misleading",summary:'Out of date and category-blind. Product/UX design is one of the better-paid creative careers in India today (top firms ₹12–20L+), and it’s skill-and-portfolio gated, not "just drawing." The claim usually pictures design as it was two decades ago.',detail:'The reframe: design pay is bimodal and portfolio-driven. The bottom is crowded and modest; the top is genuinely well paid. "No scope" describes someone without a portfolio, not the field.',sources:[{title:"UCEED / NID — programmes & outcomes",url:"https://www.uceed.iitb.ac.in/",tier:"primary"}],affects:["c_design","i_make"],relevant:{impact:"no_change",note:e=>`Doesn’t undercut ${st(e.chosenPathId)} — but it does underline that your portfolio, not the claim, decides which end of the pay range you land in.`},tangential:{impact:"not_applicable",note:()=>"This is about design and doesn’t touch your current path."}},{id:"coaching_required",keywords:["coaching","kota","allen","byju","must join","cannot crack","need coaching","without coaching"],truthVerdict:"misleading",summary:'This is coaching-marketing wearing the clothes of advice. Coaching can help, but "you cannot crack it without us" is a sales claim, not a finding — every year students clear JEE/NEET on self-study and cheaper online resources. It’s exactly the kind of high-confidence claim worth checking against the underlying data.',detail:"The primary data (toppers’ own accounts, NTA’s own free resources) contradicts the necessity framing. Coaching buys structure and peer pressure, which some students need and others don’t — but it is not a gate, and the ₹1.5–3L price tag deserves scrutiny before it’s treated as mandatory.",sources:[{title:"NTA — official free prep resources",url:"https://nta.ac.in/",tier:"primary"}],affects:["s_pcm","s_pcb","c_engineering","c_medicine"],relevant:{impact:"partial_adjustment",note:()=>'Treat the "must have coaching" line as a budget question, not a fact. It may still be worth it for you — but as a choice, not a requirement, and weighed against your constraints.'},tangential:{impact:"no_change",note:()=>"This is about entrance coaching and doesn’t bear on your current path."}},{id:"commerce_needs_maths",keywords:["commerce","without maths","no maths","no scope","need maths"],truthVerdict:"partly_true",summary:'Half-right. Dropping Maths does close the easy CA track, most analytics, and economics honours at strong colleges. It does not close law, management, digital marketing, company secretaryship, or B.Com itself. "No scope without Maths" overstates a real but bounded trade-off.',detail:"The accurate version names what’s lost (quantitative finance/analytics ease) and what remains (law, management, CS, marketing). Whether that trade is right depends on which of those you actually want — which is the real question hiding under the claim.",sources:[{title:"ICAI / ICSI — eligibility routes",url:"https://www.icai.org/",tier:"primary"}],affects:["s_com","c_bcom","c_bba","c_digital_marketing","c_law"],relevant:{impact:"no_change",note:e=>`${st(e.chosenPathId)} doesn’t require Maths, so the claim doesn’t threaten it — just be clear-eyed that dropping Maths does close some quantitative paths for good.`},tangential:{impact:"no_change",note:()=>"This is about the commerce-without-Maths trade-off and doesn’t touch your current path."}},{id:"abroad_always_better",keywords:["abroad","foreign","us","uk","canada","australia","always better","guaranteed","settle abroad","onsite"],truthVerdict:"misleading",summary:"Sometimes transformative, sometimes a very expensive mistake — and the claim erases the difference. Studying abroad can pay off enormously or leave a family with debt and no visa pathway, depending on field, cost, and immigration policy that shifts year to year.",detail:'The honest read is conditional: return on a foreign degree depends heavily on the specific programme’s cost, the field’s demand in that country, and post-study work/visa rules that change with each government. "Always better" hides all three variables — which are exactly the ones that decide whether it’s worth ₹40L–1cr+.',sources:[{title:"Ministry of External Affairs — study-abroad advisories",url:"https://www.mea.gov.in/",tier:"primary"}],affects:[],relevant:{impact:"partial_adjustment",note:()=>"Treat this as a cost-and-visa question specific to one programme, never a blanket upgrade. The numbers, not the aspiration, decide it."},tangential:{impact:"partial_adjustment",note:()=>'It doesn’t map onto one path, but if going abroad is in the mix, judge each programme on its own cost and visa reality — not on "abroad is better."'}},{id:"psychology_no_jobs",keywords:["psychology","psychologist","no jobs","no scope","no future"],truthVerdict:"partly_true",summary:"True for a bachelor’s alone, false for the field. Psychology with only a B.A. does struggle — but the field is growing, and a master’s (plus licensing for clinical work) opens genuine, in-demand roles in clinical, counselling, organisational, and research settings.",detail:'The claim is really "psychology-with-just-a-bachelor’s has thin options," which is fair. Extended to the field it’s wrong: demand for mental-health and organisational-psychology professionals is rising. The fix is the master’s, which this path assumes anyway.',sources:[{title:"Rehabilitation Council of India — recognised programmes",url:"https://rehabcouncil.nic.in/",tier:"primary"}],affects:["c_psychology","s_hum"],relevant:{impact:"no_change",note:e=>`Doesn’t threaten ${st(e.chosenPathId)} as long as your plan already includes a master’s — which it needs to. If your plan stops at a bachelor’s, the claim has a point.`},tangential:{impact:"no_change",note:()=>"This is about psychology and doesn’t touch your current path."}}];function st(e){var t;return e?((t=ne[e])==null?void 0:t.label)??"your path":"your path"}function ur(e){return e.toLowerCase().replace(/[’]/g,"'")}function Vx(e,t){const n=ur(e);let r=0;for(const i of t.keywords)n.includes(ur(i))&&(r+=i.includes(" ")?2:1);return r}function Bx(e,t){var s;const n=ur(e.claim);if(bm.some(o=>n.includes(ur(o))))return{truthVerdict:"not_a_claim",impact:"not_applicable",impactNote:"This isn’t a fact I can check for you — and I don’t want to hand you a data-flavoured answer to something that isn’t about data.",summary:"What you’ve shared sounds less like a claim to verify and more like something heavy you’re carrying. That’s real, and it deserves a person, not a verdict.",detail:"Please talk to someone you trust — a counsellor, a teacher, a family member you feel safe with. In India you can reach the Tele-MANAS helpline at 14416 (or 1-800-891-4416), free and confidential, any time. This tool can help you think clearly about paths and numbers; it can’t and shouldn’t stand in for that support.",sources:[{title:"Tele-MANAS — national mental-health helpline (Govt. of India)",url:"https://telemanas.mohfw.gov.in/",tier:"primary"}],escalate:!0};let r=null,i=0;for(const o of Rx){const a=Vx(n,o);a>i&&(i=a,r=o)}if(r&&i>=2){const o=t.chosenPathId,l=!!o&&(r.affects.includes(o)||r.affects.includes(((s=ne[o])==null?void 0:s.parentId)??""))?r.relevant:r.tangential??r.relevant;return{truthVerdict:r.truthVerdict,impact:l.impact,impactNote:l.note(t),summary:r.summary,detail:r.detail,sources:r.sources}}return{truthVerdict:"unverifiable",impact:t.chosenPathId?"no_change":"not_applicable",impactNote:t.chosenPathId?`I can’t responsibly verify this one against current data from here, so I won’t pretend it changes anything about ${st(t.chosenPathId)}. Take it to the official source below before you let it weigh on the decision.`:"I can’t verify this one from here — and I won’t manufacture a verdict. Check it against a primary source before it carries any weight.",summary:'This claim is outside what I can currently ground against real data. Rather than guess, I’m flagging it as unverified — a confident-sounding answer here would be worse than an honest "not checked."',detail:"A live grounding pass would search current, primary sources for exactly this claim and weight official data over marketing. Until then, treat it as unconfirmed: find who b
